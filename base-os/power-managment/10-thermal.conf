# TLP drop-in: thermal tuning for ThinkPad X1 Carbon Gen 12 (Core Ultra 7 165U)
# Install as /etc/tlp.d/10-thermal.conf
#
# Measured on this machine (smd):
#   idle                     ~3W    51-57C   fan off
#   14x shell busy-loop      37W    74-76C   fan ~3600rpm
#   14x openssl AES-GCM     ~31W             (AES-NI)
#   Tjmax 110C. Fan ramps 2400 -> 3600rpm in roughly 15 seconds.
#
# Cooling is healthy. The dmesg throttle messages come from short bursts: PL2 is
# locked at 55W on this part (power_limit_1_min_uw == power_limit_1_max_uw), so a
# burst draws full power and the silicon reaches ~100C long before the fan responds.
#
# PL1 is adjustable but TLP cannot set it. Confirmed three ways: no RAPL key exists
# in the tlp.conf key set, no reference to rapl/powercap anywhere in /usr/share/tlp
# or /usr/sbin/tlp, and upstream documents it as unsupported. The PL1 clamp is
# therefore handled by rapl-pl1-clamp.service, not here.

# Make HWP less eager to race to maximum frequency for short background bursts.
# This is the only lever TLP has that touches burst behaviour, given PL2 is fixed.
# Kernel/TLP default on AC is balance_performance.
# Revert by deleting this file and running: tlp start
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power

# Deliberately NOT setting PLATFORM_PROFILE_ON_AC here.
#
# Setting it to "balanced" was tried and did not move PL1, because DPTF is inert on
# this machine: INT3400 mode is "disabled" and its current_uuid is empty, so nothing
# translates the ACPI profile into RAPL limits. The profile still reaches the EC via
# DYTC, and on ThinkPads "performance" generally drives a more aggressive fan curve.
# Since fan lag is the actual cause of the temperature spikes, a slower ramp would
# work against us. Leaving TLP's default (performance) in place is the safer choice
# until measured otherwise.
#
# To A/B it, watch fan ramp under load with each profile:
#   PLATFORM_PROFILE_ON_AC=balanced
